name: Publish SmartFill guide

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site
        run: |
          mkdir -p _site/assets
          cp docs/index.html docs/connection.html docs/device-setup.html docs/connection.png _site/
          cp -R docs/assets/photos docs/assets/illustrations _site/assets/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
