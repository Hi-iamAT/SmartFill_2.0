<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">SmartFill system overview</title>
  <desc id="desc">An ultrasonic sensor measures a water tank, the ESP32 shows readings and runs pump safety logic, and a relay controls the pump. HydroLevel exchanges readings and commands over Wi-Fi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b46"/><stop offset="1" stop-color="#0c7482"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#58e0cb"/><stop offset="1" stop-color="#168db4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#06283d" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1a8794"/></marker>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a7eee3"/></marker>
  </defs>
  <rect width="1200" height="560" rx="30" fill="#eff7f7"/>
  <path d="M0 0h1200v147H0z" fill="url(#bg)"/>
  <text x="58" y="67" fill="#fff" font-family="system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="3">SMARTFILL 2.0 · SYSTEM OVERVIEW</text>
  <text x="58" y="111" fill="#e9ffff" font-family="system-ui,sans-serif" font-size="30" font-weight="700">Measure locally. Connect when online.</text>
  <g filter="url(#shadow)">
    <rect x="55" y="190" width="245" height="298" rx="22" fill="#fff"/>
    <rect x="343" y="190" width="275" height="298" rx="22" fill="#fff"/>
    <rect x="661" y="190" width="211" height="298" rx="22" fill="#fff"/>
    <rect x="914" y="190" width="231" height="298" rx="22" fill="#fff"/>
  </g>
  <!-- tank -->
  <path d="M112 266v148q0 16 16 16h105q16 0 16-16V266" fill="#f7fbfc" stroke="#7394a5" stroke-width="4"/>
  <path d="M116 347q25-14 50 0t50 0q17-10 33 0v67q0 13-14 13h-105q-14 0-14-13z" fill="url(#water)"/>
  <path d="M119 347q22-13 46 0t49 0q19-10 34 0" fill="none" stroke="#c8fff4" stroke-width="4"/>
  <rect x="160" y="226" width="42" height="22" rx="6" fill="#243f55"/>
  <circle cx="171" cy="237" r="5" fill="#70e6d5"/><circle cx="191" cy="237" r="5" fill="#70e6d5"/>
  <path d="M181 250v75" stroke="#19a5a7" stroke-width="3" stroke-dasharray="6 7"/>
  <text x="177" y="457" text-anchor="middle" fill="#173b51" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Tank + HC-SR04</text>
  <text x="177" y="479" text-anchor="middle" fill="#678092" font-family="system-ui,sans-serif" font-size="13">Distance → water level</text>
  <!-- ESP -->
  <rect x="415" y="248" width="130" height="157" rx="14" fill="#183e56"/>
  <rect x="434" y="264" width="92" height="50" rx="7" fill="#baf7e9"/>
  <text x="480" y="286" text-anchor="middle" fill="#155468" font-family="system-ui,sans-serif" font-size="11" font-weight="700">LEVEL 42%</text>
  <text x="480" y="302" text-anchor="middle" fill="#357a81" font-family="system-ui,sans-serif" font-size="9">AUTO · PUMP OFF</text>
  <rect x="455" y="332" width="50" height="43" rx="6" fill="#0b2335"/>
  <text x="480" y="358" text-anchor="middle" fill="#6be4cf" font-family="system-ui,sans-serif" font-size="13" font-weight="700">ESP32</text>
  <g fill="#d1a546"><circle cx="429" cy="238" r="4"/><circle cx="448" cy="238" r="4"/><circle cx="467" cy="238" r="4"/><circle cx="486" cy="238" r="4"/><circle cx="505" cy="238" r="4"/><circle cx="524" cy="238" r="4"/></g>
  <text x="480" y="457" text-anchor="middle" fill="#173b51" font-family="system-ui,sans-serif" font-size="17" font-weight="700">ESP32 controller</text>
  <text x="480" y="479" text-anchor="middle" fill="#678092" font-family="system-ui,sans-serif" font-size="13">Local measurement + safety</text>
  <!-- relay -->
  <rect x="706" y="263" width="119" height="104" rx="13" fill="#e9f4f4" stroke="#9fc5c9" stroke-width="2"/>
  <path d="M724 316h15l10-25 16 50 13-25h25" fill="none" stroke="#0e7f89" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="726" cy="316" r="5" fill="#12a38e"/><circle cx="803" cy="316" r="5" fill="#12a38e"/>
  <path d="M765 277v-10" stroke="#d1a546" stroke-width="4"/>
  <text x="766" y="398" text-anchor="middle" fill="#537184" font-family="system-ui,sans-serif" font-size="13">GPIO-controlled relay</text>
  <text x="766" y="457" text-anchor="middle" fill="#173b51" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Pump switching</text>
  <text x="766" y="479" text-anchor="middle" fill="#678092" font-family="system-ui,sans-serif" font-size="13">Separate pump power supply</text>
  <!-- cloud -->
  <path d="M981 323q-19 0-19-18 0-17 18-19 6-31 39-31 25 0 35 22 28-5 37 18 22 4 22 24 0 24-26 24h-104q-22 0-22-20z" fill="#def6f2" stroke="#55b8ae" stroke-width="3"/>
  <text x="1065" y="309" text-anchor="middle" fill="#126471" font-family="system-ui,sans-serif" font-size="18" font-weight="700">HydroLevel</text>
  <text x="1065" y="333" text-anchor="middle" fill="#4e7c87" font-family="system-ui,sans-serif" font-size="12">readings + commands</text>
  <text x="1029" y="397" text-anchor="middle" fill="#537184" font-family="system-ui,sans-serif" font-size="13">Wi-Fi / HTTPS</text>
  <text x="1029" y="457" text-anchor="middle" fill="#173b51" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Web dashboard</text>
  <text x="1029" y="479" text-anchor="middle" fill="#678092" font-family="system-ui,sans-serif" font-size="13">Remote monitoring</text>
  <!-- paths -->
  <path d="M287 315h104" fill="none" stroke="#1a8794" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="340" y="300" text-anchor="middle" fill="#477384" font-family="system-ui,sans-serif" font-size="12">echo signal</text>
  <path d="M552 318h135" fill="none" stroke="#1a8794" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="620" y="302" text-anchor="middle" fill="#477384" font-family="system-ui,sans-serif" font-size="12">safety decision</text>
  <path d="M549 229C660 164 844 163 963 245" fill="none" stroke="#0d8e91" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="753" y="184" text-anchor="middle" fill="#217a83" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Wi-Fi readings ↑ · commands ↓</text>
  <rect x="55" y="515" width="1090" height="1" fill="#d9e8e8"/>
  <text x="600" y="540" text-anchor="middle" fill="#668091" font-family="system-ui,sans-serif" font-size="12">Automatic control and pump safeguards remain on the ESP32 when the network is offline.</text>
</svg>
